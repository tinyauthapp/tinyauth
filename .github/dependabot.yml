version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/e2e"
    groups:
      minor-patch:
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: "daily"

  - package-ecosystem: "gomod"
    directory: "/"
    groups:
      minor-patch:
        update-types:
          - "patch"
          - "minor"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"