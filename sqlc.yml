version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/sqlite/*.queries.sql"
    schema: "sql/sqlite/*.schemas.sql"
    gen:
      go:
        package: "sqlite"
        out: "internal/repository/sqlite"
        rename:
          uuid: "UUID"
          redirect_uri: "RedirectURI"
          user_uuid: "UserUUID"
          context_json: "ContextJSON"
          csrf_token: "CSRFToken"
          oidc_session: "OIDCSession"
          oidc_consent: "OIDCConsent"
        overrides:
          - column: "oidc_sessions.nonce"
            go_type: "string"
  - engine: "postgresql"
    queries: "sql/postgres/*.queries.sql"
    schema: "sql/postgres/*.schemas.sql"
    gen:
      go:
        package: "postgres"
        out: "internal/repository/postgres"
        rename:
          uuid: "UUID"
          redirect_uri: "RedirectURI"
          user_uuid: "UserUUID"
          context_json: "ContextJSON"
          csrf_token: "CSRFToken"
          oidc_session: "OIDCSession"
          oidc_consent: "OIDCConsent"